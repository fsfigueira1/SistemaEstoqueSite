# Publica o instalador Windows no GitHub Releases (auto-update dos PCs da loja).
# Faz na nuvem o mesmo que `npm run electron:publish` faz no PC servidor, para
# dar para soltar atualização sem estar na loja.
#
# Dispara quando uma tag vX.Y.Z é enviada (a versão tem que bater com o
# package.json), ou manualmente em Actions → "Publicar instalador" → Run workflow.
name: Publicar instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Conferir versão x tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão $v do package.json"; exit 1
          fi

      - run: npm ci

      # prebuild roda o prisma generate
      - run: npm run build

      - run: node scripts/prepare-standalone.cjs

      # Gera sem publicar: o "--publish always" do electron-builder cria a
      # versão e sobe os arquivos em paralelo, e às vezes duplica a versão ou
      # perde o latest.yml. Aqui a publicação é feita em ordem, logo abaixo.
      - name: Gerar o instalador
        shell: bash
        run: npx electron-builder --win nsis --publish never --config.directories.output=dist-release

      - name: Publicar no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          ls -la dist-release
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$v" --notes "Laçolaria $v" --target "$GITHUB_SHA"
          fi
          # latest.yml por último: os PCs só enxergam a versão nova quando o
          # instalador certo já está lá.
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            dist-release/Lacolaria-Setup.exe dist-release/Lacolaria-Setup.exe.blockmap
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist-release/latest.yml
